name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'karlos1998/gwent-classic-online' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: npm ci && npm run typecheck
      - name: Check client loading and music
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:client
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check backend
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Build and pack images
        run: |
          docker build -t gwent-online-server:${{ github.sha }} backend
          docker build -t gwent-online-web:${{ github.sha }} frontend
          mkdir -p artifact
          docker save gwent-online-server:${{ github.sha }} gwent-online-web:${{ github.sha }} | gzip -1 > artifact/images.tar.gz
          printf '%s\n' '${{ github.sha }}' > artifact/TAG
          cp docker-compose.production.yml deploy/activate.sh artifact/
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$SERVER_USER@$SERVER_HOST"
          staging="/opt/apps/gwent-classic-online/releases/${{ github.sha }}"
          ssh -i ~/.ssh/deploy_key "$target" "mkdir -p '$staging'"
          scp -i ~/.ssh/deploy_key artifact/* "$target:$staging/"
          ssh -i ~/.ssh/deploy_key "$target" "bash '$staging/activate.sh' '$staging'"
      - name: Verify public endpoint
        run: curl --fail --location --max-redirs 5 --max-time 20 --retry 12 --retry-delay 10 --retry-all-errors https://gwent.letscode.it/ -o /dev/null
