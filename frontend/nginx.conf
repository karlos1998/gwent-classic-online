# Serves the Vue build and proxies the online mode to the Spring Boot backend (service "server").
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.youtube.com https://s.ytimg.com; frame-src https://challenges.cloudflare.com https://www.youtube.com; connect-src 'self' https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  client_max_body_size 16k;

  # Diagnostics are private, even if enabled on the backend for local troubleshooting.
  location /actuator { return 404; }
  location /swagger-ui { return 404; }
  location /v3/api-docs { return 404; }
  location /api/docs { return 404; }

  # REST (guest sessions)
  location /api/ {
    proxy_pass http://server:47321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
  }

  # game WebSocket
  location = /ws {
    proxy_pass http://server:47321;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA routes (/offline, /online ...)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
