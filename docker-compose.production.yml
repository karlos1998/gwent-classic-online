name: gwent-classic-online
services:
  server:
    image: gwent-online-server:${TAG:?Set TAG to the deployed commit}
    restart: unless-stopped
    environment:
      GWENT_ALLOWED_ORIGINS: https://gwent.letscode.it
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
    networks: [gwent]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: gwent-online-web:${TAG:?Set TAG to the deployed commit}
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: gwent.letscode.it
      VIRTUAL_PORT: '80'
      LETSENCRYPT_HOST: gwent.letscode.it
    networks: [gwent, nginx-proxy]
    depends_on:
      server:
        condition: service_healthy
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  gwent:
    ipam:
      config:
        - subnet: 192.168.48.0/28
  nginx-proxy:
    external: true
